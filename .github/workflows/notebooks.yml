name: Notebook compatibility
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15.2'
      - run: python -m pip install -r requirements/core.lock
      - run: python -m pip check
      - run: python validate_notebooks.py
      - run: python -m ruff check .
      - run: python prepare_nltk.py
      - run: python -m pytest tests -q
      - run: python smoke_notebooks.py
